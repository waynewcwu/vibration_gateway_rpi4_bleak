<!DOCTYPE html>
<html>
    <head>
        <title>BT3 Config</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../libs/bootstrap/bootstrap-3.4.1-dist/css/bootstrap.min.css">
        <script src="../libs/jquery/jquery.min.js"></script>
        <script src="../libs/bootstrap/bootstrap-3.4.1-dist/js/bootstrap.min.js"></script>
        <script src="../libs/js/common.js"></script>
    </head>

    <body>
        <script>
            var IP="";
            const CLIENT_PORT="8081";
            const SERVER_PORT="8082";
            const WBSK_PORT = "8085";
            $(document).ready(function() {
                $.ajax({
                    type:"post",
                    url:"/get/ip",
                    async:false,
                    success:function(data) {
                        IP=data;

                        var webSocket = new WebSocket("ws://" + IP + ":" + WBSK_PORT + "/");
                        webSocket.onopen = function() {
                            console.log("WebSocket Client Connected");
                        };

                        webSocket.onmessage = function(e) {
                            console.log("Received:" + e.data);
                        }
                    }
                });

                getBluetoothDeviceInfo();
                $("#protocol_list").val(localStorage.getItem("ble_protocol"));
            })

            function getUrl(path) {
                return "http://" + IP + ":" + SERVER_PORT + path;
            }

            function resetToDefault() {
                $.ajax({
                    type:"post",
                    url:getUrl("/to/default/reset"),
                    success:function(data) {
                        console.log("data ==> " + data);
                    }
                });
                $('#resetToDefault').modal('hide');
            }

            //[+] Bluetooth [+]
            function addBluetoothDevice() {
                $.ajax({
                    type:"post",
                    url:getUrl("/bluetooth/device/add"),
                    data:JSON.stringify([{
                        "ID":$('#bluetooth_device_id').val(),
                        "NAME":$('#bluetooth_device_name').val(),
                        "MAC":$('#bluetooth_mac_address').val()
                    }]),
                    success:function(data) {
                        var infos = JSON.parse(data);
                        var timestamp=getCurrentTime();
                        var tag=getLogTag($("#panel_ble").text());
                        var log1="";
                        var log2="";
                        for(var i=0;i<infos.length;i++) {
                            log1+=tag + timestamp + " " + infos[i].INFO + "\n";
                            log2+=timestamp + " " + infos[i].INFO + "\n";
                        }

                        $.ajax({
                            type:"post",
                            url:"write/frontend_log",
                            data:{"frontend_log":log1},
                            success:function(data) {
                                $("#log_history").append(log2);
                            }
                        });
                        
                        getBluetoothDeviceInfo();
                    }
                });
            }

            function removeBluetoothDevice() {
                var infos=[];
                $("table>tbody>tr").each(function () {
                    var $tr = $(this);
                    if($tr.find(".bluetoothDeviceCheckbox").is(":checked")) {
                        var $td = $tr.find("td");
                        var item={};
                        item["ID"]=$td.eq(1).text();
                        item["NAME"]=$td.eq(2).text();
                        item["MAC"]=$td.eq(3).text();
                        infos.push(item);
                    }
                });

                if(infos.length>0) {
                    console.log("info==>"+JSON.stringify(infos));
                    $.ajax({
                        type:"post",
                        url:getUrl("/bluetooth/device/remove"),
                        data:JSON.stringify(infos),
                        success:function(data) {
                            console.log("data ==> " + data);
                            var infos = JSON.parse(data);
                            var timestamp=getCurrentTime();
                            var tag=getLogTag($("#panel_ble").text());
                            var log1="";
                            var log2="";
                            for(var i=0;i<infos.length;i++) {
                                log1+=tag + timestamp + " " + infos[i].INFO + "\n";
                                log2+=timestamp + " " + infos[i].INFO + "\n";
                            }

                            $.ajax({
                                type:"post",
                                url:"write/frontend_log",
                                data:{"frontend_log":log1},
                                success:function(data) {
                                    $("#log_history").append(log2);
                                }
                            });
                            getBluetoothDeviceInfo();
                        }
                    });
                }
            }

            function getBluetoothDeviceInfo(devices) {
                $.ajax({
                    type:"post",
                    url:getUrl("/bluetooth/device/read"),
                    success:function(raw_data) {
                        $('#target_device_info').html("");
                        var header = "<thead><tr><th>Item</th><th>ID</th><th>Name</th><th>MAC</th></tr></thead>"
                        $('#target_device_info').append(header);
                        $('#target_device_info').append("<tbody>");
                
                        var data = JSON.parse(raw_data);
                        data.sort(function (a, b) {
                            return a.ID.localeCompare(b.ID);
                        })
                        for(var i=0;i<data.length;i++) {
                            var item = "<tr>" + 
                                       "<td><input type='checkbox' class='bluetoothDeviceCheckbox' onchange=bluetoothDeviceChanged() style='width:16px;height:16px;'></td>" +
                                       "<td>" + data[i].ID   + "</td>"  + 
                                       "<td>" + data[i].NAME + "</td>"  + 
                                       "<td>" + data[i].MAC  + "</td>"  + 
                                       "</tr>";
                            $('#target_device_info').append(item);
                        }
                        
                        $('#target_device_info').append("</tbody>");
                    }
                });
            }

            function bluetoothDeviceChanged() {
                $("table>tbody>tr").each(function () {
                    var $tr = $(this);
                    if($tr.find(".bluetoothDeviceCheckbox").is(":checked")) {
                        $tr.css('background-color','#ffb3b3')
                    } else {
                        $tr.css('background-color','white')
                    }
                });
            }

            function bluetoothDeviceInfoChanged() {
                var bluetooth_mac_address = $("#bluetooth_mac_address").val().trim();                
                $("#bluetooth_mac_address").val(bluetooth_mac_address);

                if($("#bluetooth_device_id").val() && $("#bluetooth_device_name").val() && $("#bluetooth_mac_address").val()) {
                    $("#btn_add_bluetooth_device").attr('disabled', false);
                } else {
                    $("#btn_add_bluetooth_device").attr('disabled', true);
                }
            }

            function rebootMcuSetting() {
                $.ajax({
                    type:"post",
                    url:getUrl("/mcu/setting/reboot"),
                    success:function(data) {
                        console.log("data ==> " + data);
                    }
                });
                $('#resetMcuSetting').modal('hide');
            }

            function scanBluetoothDevice() {
                $.ajax({
                    type:"post",
                    url:getUrl("/bluetooth/device/scan"),
                    success:function(data) {
                    var infos = JSON.parse(data);
                    var timestamp=getCurrentTime();
                    var tag=getLogTag($("#panel_ble").text());
                    var log1="";
                    var log2="";
                    for(var i=0;i<infos.length;i++) {
                        log1+=tag + timestamp + " " + infos[i].INFO + "\n";
                        log2+=timestamp + " " + infos[i].INFO + "\n";
                    }

                    $.ajax({
                        type:"post",
                        url:"write/frontend_log",
                        data:{"frontend_log":log1},
                        success:function(data) {
                            $("#log_history").append(log2);
                        }
                    });
                    }
                });
            }
            //[-] Bluetooth [-]

            //[+] Protocol [+]
            function setProtocol() {
                $.ajax({
                    type:"post",
                    url:getUrl("/get/protocol"),
                    data:JSON.stringify({
                        "PROTOCOL":$("#protocol_list").val()
                    }),
                    success:function(data) {
                        localStorage.setItem("ble_protocol", $("#protocol_list").val());
                        
                        var infos = JSON.parse(data);
                        var timestamp=getCurrentTime();
                        var tag=getLogTag($("#panel_ble").text());
                        var log1="";
                        var log2="";
                        for(var i=0;i<infos.length;i++) {
                            log1+=tag + timestamp + " " + infos[i].INFO + "\n";
                            log2+=timestamp + " " + infos[i].INFO + "\n";
                        }

                        $.ajax({
                            type:"post",
                            url:"write/frontend_log",
                            data:{"frontend_log":log1},
                            success:function(data) {
                                $("#log_history").append(log2);
                            }
                        });
                    }
                });
            }
            //[-] Protocol [-]
        </script>

        <div class="container" style="width:90%;font-family:Arial,Microsoft JhengHei;">
            <div style="width:100%;margin-bottom:150px;">
                <img src="../images/icon_umc_ble_gateway.png" style="float:left;"></img>
                <button type="button" class="btn btn-danger" data-toggle="modal" data-target="#resetToDefault" style="float:right;margin-top:15px;">RESET</button>
            </div>
            
            <hr>
            <ul class="nav nav-tabs" style="font-size:18px;">
                <li id="panel_ble" class="active"><a href="ble">BLE</a></li>
                <li id="panel_mcu"><a href="mcu_setting">MCU OTA</a></li>
                <li id="panel_network"><a href="network_setting">Network Steup</a></li>
                <li id="panel_connection"><a href="connection_status">Connecting Status</a></li>
                <li id="panel_log"><a href="log_checking">Log Information</a></li>
                <li id="panel_notes"><a href="notes">Notes</a></li>
            </ul>

            <div style="float:left;width:50%;margin-top:10px;">
                <div class="panel panel-success">
                    <div class="panel-heading">
                        <span style="font-size:18px;">BLE Setup</span>
                    </div>
                    <div class="panel-body" id="bluetooth_setting">
                        <div style="height:200px;">
                            <div class="input-group">
                                <span class="input-group-addon">ID</span>
                                <input id="bluetooth_device_id" type="text" class="form-control" onkeyup="bluetoothDeviceInfoChanged()" placeholder="Device ID">
                            </div>
                            <br>
                            <div class="input-group">
                                <span class="input-group-addon">Name</span>
                                <input id="bluetooth_device_name" type="text" class="form-control" onkeyup="bluetoothDeviceInfoChanged()" placeholder="Device name">
                            </div>
                            <br>
                            <div class="input-group">
                                <span class="input-group-addon">MAC</span>
                                <input id="bluetooth_mac_address" type="text" class="form-control" onkeyup="bluetoothDeviceInfoChanged()" placeholder="Device MAC address">
                            </div>
                            <br>
                            <button type="button" class="btn btn-warning" id="btn_add_bluetooth_device" style="float:left;" onclick="addBluetoothDevice()" disabled>Add Device</button>
                            <button type="button" class="btn btn-warning" style="margin-left:15px;" onclick="scanBluetoothDevice()">Scan Device</button>
                        </div>
                        <hr>

                        <div style="height:250px;">
                            <div style="margin-top:20px;height:300px;overflow:auto;">
                                <table class="table table-bordered" id="target_device_info"></table>
                            </div>
                            <button type="button" class="btn btn-warning" style="float:left;margin-top:10px;" onclick="removeBluetoothDevice()">Remove Device</button>
                        </div>
                        <hr>
                    </div>
                </div>

                <div class="panel panel-success">
                    <div class="panel-heading">
                        <span style="font-size:18px;">Toplayer Protocol</span>
                    </div>
                    
                    <div class="panel-body" id="protocol_setting">
                        <div class="form-group">
                            <select class="form-control" id="protocol_list">
                            <option>Modbus</option>
                            <option>Restful</option>
                            <option>Mqtt</option>
                            </select>
                        </div>

                        <button type="button" class="btn btn-warning" style="float:left;margin-top:15px;width:70px;" onclick="setProtocol()">Confirm</button>
                        <button type="button" class="btn btn-warning" style="float:left;margin-top:15px;margin-left:10px;width:90px;" onclick="rebootMcuSetting()">Restart</button>
                    </div>
                </div>
            </div>

            <div class="panel panel-success" style="float:right;width:49%;margin-top:10px;">
                <div class="panel-heading">Logs</div>

                <div class="panel-body collapse in">
                    <textarea id="log_history" class="md-textarea form-control" rows="38" style="margin-top:6px;margin-bottom:6px;"></textarea>
                </div>
            </div>
        </div>

        <!-- [+] Modal resetToDefault [+] -->
        <div class="modal fade" id="resetToDefault" role="dialog" style="font-family:Arial,Microsoft JhengHei;">
            <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-body">
                    <p style="font-size:18px;">Confirm Reset?</p>
                </div>

                <div class="modal-footer" style="font-size:18px;">
                    <button type="button" class="btn btn-default" onclick="resetToDefault()">yes</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">no</button>
                </div>
            </div>
            </div>
        </div>
        <!-- [-] Modal resetToDefault [-] -->
    </body>
</html>
